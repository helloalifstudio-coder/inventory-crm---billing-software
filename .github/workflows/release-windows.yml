name: Build Native Windows Installer (.exe & .msi)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build AGM Showroom Suite (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows-native/src-tauri

      - name: Install Node dependencies & run verification gate
        run: |
          npm ci
          npm run build
          npm run prepare:windows

      - name: Run Rust unit tests (GST, ESC/POS, SQLite WAL & VACUUM INTO)
        working-directory: apps/windows-native/src-tauri
        run: cargo test --verbose

      - name: Build Tauri v2 Native Windows Installers (NSIS .exe + WiX .msi)
        working-directory: apps/windows-native/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis,msi

      - name: Upload Windows .exe and .msi Installers
        uses: actions/upload-artifact@v4
        with:
          name: AGM-Showroom-Suite-Windows-x64
          path: |
            apps/windows-native/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows-native/src-tauri/target/release/bundle/msi/*.msi
            apps/windows-native/src-tauri/target/release/agm-showroom-suite.exe
          if-no-files-found: error
